<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>File Monitor — raw HTMX</title>
    <link rel="stylesheet" href="/flux.css" />
    <!-- Raw HTMX only — no Flux. Written the verbose way to show what Flux hides. -->
    <script defer src="/htmx.js"></script>
  </head>
  <body style="padding: 2rem; font-family: system-ui">
    <h1>File Monitor <span class="flux-muted">(raw HTMX)</span></h1>

    <h2>Stats</h2>
    <section
      hx-get="/fragment/stats"
      hx-trigger="load"
      hx-target="this"
      hx-swap="innerHTML"
    ></section>

    <h2>Exceptions</h2>
    <section
      hx-get="/fragment/exceptions"
      hx-trigger="load"
      hx-target="this"
      hx-swap="innerHTML"
    ></section>

    <p class="flux-muted">
      <a href="/">Compare with Flux →</a>
    </p>
  </body>
</html>

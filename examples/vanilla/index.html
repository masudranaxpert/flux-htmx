<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flux — vanilla example</title>
    <link rel="stylesheet" href="/flux.css" />
    <!-- Use the standalone bundle: htmx + Alpine + Flux in one file. -->
    <script defer src="/flux.full.iife.js"></script>
  </head>
  <body style="padding: 2rem; font-family: system-ui">
    <h1>Flux vanilla example</h1>

    <h2>fx-get — load a fragment on click</h2>
    <button class="flux-btn" fx-get="/fragment/users" fx-target="#users">Load users</button>
    <div id="users" class="flux-card"></div>

    <h2>fx-load — fetch on page load</h2>
    <section fx-load="/fragment/stats" fx-target="this" class="flux-card"></section>

    <h2>fx-search — debounced live search</h2>
    <input
      class="flux-btn"
      fx-search="/fragment/search"
      fx-target="#results"
      fx-delay="300ms"
      placeholder="Search…"
    />
    <div id="results" class="flux-card"></div>
  </body>
</html>

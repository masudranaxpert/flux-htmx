<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flux e2e</title>
    <!-- htmx first: it instantiates and schedules a deferred process(document.body). -->
    <script src="/htmx.js"></script>
    <!-- Flux next: its auto-configure registers the before:process listener synchronously,
         before htmx's deferred init() runs. -->
    <script src="/flux.js"></script>
    <!-- Optional net extras: exposes FluxNet (upload/optimistic plugins + offline). -->
    <script src="/net.js"></script>
  </head>
  <body>
    <!-- 1. fx-get on initial DOM must be processed into hx-get; hx-target configures the swap. -->
    <button id="btn1" fx-get="/fragment/hello" hx-target="#result1">Load</button>
    <div id="result1"></div>
    <!-- 2. Raw hx-* must remain a working escape hatch. -->
    <button id="btn2" hx-get="/fragment/hello" hx-target="#result2">Raw</button>
    <div id="result2"></div>

    <!-- 3. Mixed fx-* and hx-*: raw hx-target wins, fx-get expands. -->
    <button id="btn3" fx-get="/fragment/hello" hx-target="#result3">Mixed</button>
    <div id="result3"></div>

    <!-- 4. Swapped content with fx-get must be processed and work. -->
    <button id="load-swapped" fx-get="/fragment/swapped" hx-target="#swap-host">
      Load swapped
    </button>
    <div id="swap-host"></div>
  </body>
</html>
